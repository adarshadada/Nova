name: unzip-and-build
on: { push: { branches: [main] }, workflow_dispatch: {} }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          ls -la
          unzip -oq "$(ls *.zip | head -1)"
          F=$(find . -name settings.gradle.kts | head -1)
          echo "Project at: $F"
          echo "DIR=$(dirname "$F")" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle assembleDebug --stacktrace
        working-directory: ${{ env.DIR }}
      - uses: actions/upload-artifact@v4
        with: { name: nova-debug-apk, path: "${{ env.DIR }}/app/build/outputs/apk/debug/*.apk" }
