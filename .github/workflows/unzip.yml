name: unzip-and-build
on: { push: { branches: [main] }, workflow_dispatch: {} }
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          unzip -oq "$(ls *.zip | head -1)"
          F=$(find . -name settings.gradle.kts | head -1)
          echo "DIR=$(dirname "$F")" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle assembleDebug --stacktrace
        working-directory: ${{ env.DIR }}
      - uses: actions/upload-artifact@v4
        with: { name: nova-debug-apk, path: "${{ env.DIR }}/app/build/outputs/apk/debug/*.apk" }
